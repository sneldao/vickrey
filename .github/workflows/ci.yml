name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          for file in apps/field/*.js apps/field/*.mjs apps/explorer/*.js apps/explorer/*.mjs apps/receipts/*.js apps/receipts/*.mjs; do
            [ -e "$file" ] || continue
            node --check "$file"
          done
      - name: Run client tests
        run: node --test apps/field/*.test.mjs apps/explorer/*.test.mjs

  browser:
    name: Browser recovery and accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install receipts service dependencies
        working-directory: services/receipts
        run: python -m pip install -r requirements.txt
      - name: Run browser tests against real receipts service
        env:
          RECEIPTS_UPSTREAM: http://127.0.0.1:18099
        run: |
          export RECEIPTS_MODE=demo
          export RECEIPTS_DATABASE_PATH="$RUNNER_TEMP/receipts-browser.db"
          export RECEIPTS_QUOTA_PER_HOUR=10000
          python -m uvicorn app.main:create_app --factory --app-dir services/receipts --host 127.0.0.1 --port 18099 --no-access-log &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18099/healthz; then
              printf '\n'
              ready=true
              break
            fi
            if ! kill -0 "$service_pid" 2>/dev/null; then
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            exit 1
          fi
          npm run test:browser

  ledger:
    name: Ledger contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ledger
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ledger/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  zanchor:
    name: Anchor contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/zanchor
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/zanchor/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests -q

  receipts:
    name: Reality Receipts contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/receipts
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/receipts/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run service tests
        run: python -m pytest -q
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Run browser client contracts
        run: node --test ../../apps/receipts/app.test.mjs

  static:
    name: Scripts and deployment syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n services/zanchor/docker/run_*.sh
      - name: Check Python syntax
        run: python3 -m compileall -q services

  packaging:
    name: Container packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build service images
        run: |
          docker build -q -t vickrey-ledger:ci services/ledger
          docker build -q -t vickrey-zanchor:ci services/zanchor
          docker build -q -t vickrey-receipts:ci services/receipts
      - name: Build web images
        run: |
          docker build -q -t vickrey-explorer:ci -f apps/explorer/Dockerfile .
          docker build -q -t vickrey-demo:ci -f services/demo/Dockerfile .
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
