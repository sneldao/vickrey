name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Assemble the site
        run: |
          # apps/site stays at the root so the existing showcase URL keeps
          # working; the field client and the explorer are published beside it
          # at /field/ and /explorer/, so the shared nav's relative links resolve
          # from any of the three pages.
          mkdir -p _site/field _site/explorer
          cp -r apps/site/. _site/
          for app in field explorer; do
            for f in apps/$app/*.js apps/$app/*.html apps/$app/*.css; do
              [ -e "$f" ] || continue
              case "$f" in
                *.test.mjs) continue ;;
              esac
              cp "$f" _site/$app/
            done
          done
          # The committed explorer/config.js keeps localhost defaults, because
          # the Docker entrypoint rewrites it from EXPLORER_LEDGER_URL for the
          # demo box. The published copy has to talk to the deployed ledger, so
          # it is patched here and nowhere else. Committed zanchorUrl stays
          # "/api" for the combined-host demo; Pages is static-only so the
          # generated configs point at the live HTTPS endpoint instead. The
          # public ledger stays a separate legacy target.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("_site/explorer/config.js")
          text = path.read_text()
          patched = text.replace(
              'ledgerUrl: "http://localhost:8088"',
              'ledgerUrl: "https://vickrey-ledger.fly.dev"',
          )
          assert patched != text, "explorer config.js: ledgerUrl default not found"
          path.write_text(patched)

          for app in ("field", "explorer"):
              path = Path(f"_site/{app}/config.js")
              text = path.read_text()
              patched = text.replace(
                  'zanchorUrl: "/api"',
                  'zanchorUrl: "https://vickrey.144.202.117.160.sslip.io/api"',
              )
              assert patched != text, f"{app} config.js: zanchorUrl default not found"
              path.write_text(patched)
          PY
          echo "published:"; find _site -maxdepth 2 -type f | sort
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
