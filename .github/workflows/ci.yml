name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642cc1e84afbd3f7d5a086a3 # v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          for file in apps/field/*.js apps/explorer/*.js; do
            [ -e "$file" ] || continue
            node --check "$file"
          done
      - name: Run client tests
        run: node --test apps/field/*.test.mjs apps/explorer/*.test.mjs

  browser:
    name: Browser recovery and accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642cc1e84afbd3f7d5a086a3 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:browser

  ledger:
    name: Ledger contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ledger
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  zanchor:
    name: Anchor contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/zanchor
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests -q

  receipts:
    name: Reality Receipts contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/receipts
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  static:
    name: Scripts and deployment syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n services/zanchor/docker/run_*.sh
      - name: Check Python syntax
        run: python3 -m compileall -q services

  packaging:
    name: Container packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build service images
        run: |
          docker build -q -t vickrey-ledger:ci services/ledger
          docker build -q -t vickrey-zanchor:ci services/zanchor
          docker build -q -t vickrey-receipts:ci services/receipts
      - name: Build web images
        run: |
          docker build -q -t vickrey-explorer:ci -f apps/explorer/Dockerfile .
          docker build -q -t vickrey-demo:ci -f services/demo/Dockerfile .
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
