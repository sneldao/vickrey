# Vickrey demo: static apps + same-origin zanchor and receipts proxies.
# Privacy: no Referer upstream, no API caching, no path logging of receipt
# ids or query strings, small request bodies (files stay local).

limit_req_zone $binary_remote_addr zone=vickrey_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=vickrey_anchor:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=vickrey_receipts:10m rate=5r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Receipt ids are bearer capabilities: nothing in this service is logged,
    # including receipt URLs in static paths and malformed API requests.
    access_log off;
    error_log /dev/null;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 16k;

    location = / {
        try_files $uri /index.html;
    }

    location /field/ {
        try_files $uri $uri/ /field/index.html;
    }

    location /explorer/ {
        try_files $uri $uri/ /explorer/index.html;
    }

    location /receipts/ {
        try_files $uri $uri/ /receipts/index.html;
    }

    # Allowlisted API surfaces only: no Swagger/docs, raw RPC or list endpoints.
    # Reality Receipts keeps its root /healthz and /v1 paths unchanged.
    location = /healthz {
        limit_req zone=vickrey_receipts burst=20 nodelay;
        limit_req_status 429;
        limit_except GET HEAD { deny all; }
        access_log off;
        error_log /dev/null;
        proxy_pass http://receipts:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer "";
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /v1/ {
        limit_req zone=vickrey_receipts burst=20 nodelay;
        limit_req_status 429;
        limit_except GET HEAD POST { deny all; }
        access_log off;
        error_log /dev/null;
        proxy_pass http://receipts:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer "";
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # /api prefix is stripped before proxying (zanchor serves /health,
    # /receipts/..., /chain/tx/... at its own root).
    location = /api/anchor {
        limit_req zone=vickrey_anchor burst=3 nodelay;
        limit_req_status 429;
        # OPTIONS must pass too: the app's CORS middleware answers preflights.
        limit_except POST OPTIONS { deny all; }
        access_log off;
        proxy_pass http://vickrey-demo-api:8092/anchor;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer "";
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/api/(health|receipts/[^/]+(?:/(?:verify|disclosure))?|chain/tx/[^/]+)$ {
        limit_req zone=vickrey_api burst=20 nodelay;
        limit_req_status 429;
        access_log off;
        error_log /dev/null;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://vickrey-demo-api:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer "";
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        return 404;
    }
}
