[package]
name = "vickrey-wallet-tool"
version = "0.1.0"
edition = "2021"
license = "MIT"
[[bin]]
name = "zcashd-wallet-tool"
path = "src/main.rs"
[dependencies]
anyhow = "=1.0.102"
backtrace = "=0.3.76"
clearscreen = "=4.0.6"
gumdrop = "=0.8.1"
rand = "=0.8.6"
secrecy = "=0.8.0"
thiserror = "=2.0.18"
time = { version = "=0.3.51", features = ["formatting", "macros"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "time"] }
